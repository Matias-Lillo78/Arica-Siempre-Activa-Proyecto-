{% extends "AricaSiempreActiva/base.html" %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="panel-wrapper d-flex w-100 overflow-hidden">
    <main class="flex-grow-1 p-4 p-md-5 overflow-auto">
        <div class="container" style="max-width: 800px;">
            
            <div class="card-panel p-4 p-md-5 bg-white shadow-sm rounded-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bolder text-dark-blue mb-1">{{ accion }} Actividad</h2>
                        <p class="text-muted mb-0 small">Completa los campos para gestionar la experiencia del gremio.</p>
                    </div>
                    <a href="{% url 'listar_gremio' %}" class="btn btn-outline-secondary fw-bold px-3 rounded-pill small">Volver al listado</a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {{ form|crispy }}

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'listar_gremio' %}" class="btn btn-light fw-bold rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn fw-bold px-4 shadow-sm text-white" style="background-color: #fb923c; border-radius: 0.5rem;">
                            {{ accion }} Actividad
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>
</div>
{% endblock %}
