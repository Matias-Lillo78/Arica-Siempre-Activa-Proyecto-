
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Arica Siempre Activa</title>

    <link rel="stylesheet" href="{% static 'AricaSiempreActiva/CSS/style.css' %}">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>Arica Siempre Activa</h1>
            <h2>Crear una cuenta</h2>

            <p>Regístrate como turista o integrante de un gremio.</p>

            {% if messages %}
                {% for message in messages %}
                    <p class="error-message">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="first_name">Nombre</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>

                <div class="form-group">
                    <label for="last_name">Apellido</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="rol">Tipo de cuenta</label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona una opción</option>
                        <option value="turista">Turista</option>
                        <option value="gremio">Gremio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="password2">Confirmar contraseña</label>
                    <input type="password" id="password2" name="password2" required>
                </div>

                <button type="submit">Registrarse</button>
            </form>

            <p>¿Ya tienes una cuenta?</p>
            <a href="{% url 'login' %}">Iniciar sesión</a>

        </div>

    </main>

</body>
</html>
